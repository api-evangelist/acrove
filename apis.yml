  detail: >-
    ACROVE, Inc. ships software — the ACROVE FORCE / ACROVE INSIGHT EC analytics engine, ACROVE MDM
    and the ACROVE Knowledge Base — but only as internal and client-facing end-user applications
    behind a login, and its entire public surface across acrove.co.jp (a WordPress corporate site of
    19 pages: about, service, works, company, group, news, recruit, contact, privacy) and
    commerce.acrove.co.jp (the Magento / Adobe Commerce services arm, formerly Digital-Free K.K.)
    carries no developer, API, docs or integration link anywhere in the nav, sitemap or llms.txt;
    every REST/GraphQL/OpenAPI/MCP/agent-card and /.well-known/ path probed on all five hosts the
    company operates returns a hard 404 (verified against a control path returning the identical 404
    body and status) or, on kb.acrove.co.jp, a 307 to its own login, and the company markets no API
    product, so this is an absent developer program rather than a gated one.
