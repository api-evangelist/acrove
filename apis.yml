aid: acrove
name: ACROVE, Inc.
description: >-
  ACROVE, Inc. (株式会社ACROVE) is a Tokyo e-commerce platform and brand roll-up company, founded 15 November
  2018 as Anoma, Inc. and renamed ACROVE in October 2020, led by representative director Shunsuke Arai and
  headquartered in Nishi-Shinjuku. It runs two businesses: a Commerce Transformation practice that grows
  client brand sales on Amazon, Rakuten, Qoo10 and other Japanese marketplaces using its proprietary EC
  analytics engine ACROVE FORCE (now presented as ACROVE INSIGHT), and an EC roll-up business that
  acquires and operates consumer brands. It reports support for 170+ client companies and raised a Series
  C in September 2024. Its commerce arm — the former Digital-Free K.K., now 株式会社Acrove at
  commerce.acrove.co.jp — is a Magento / Adobe Commerce implementation specialist. ACROVE FORCE, ACROVE
  MDM and the ACROVE Knowledge Base are login-gated applications; the company publishes no public API,
  SDK, webhook surface, machine-readable contract or developer portal on any host it operates.
